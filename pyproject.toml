[project]
name = "alt-agent-harness"
version = "0.1.0"
description = "A simple skill-based agent harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "textual>=8.2.8",
]

[project.scripts]
alt-agent-harness = "agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/interfaces"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
