name: macOS app

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "scripts/build_macos_app.sh"
      - ".github/workflows/macos-app.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the app to (optional, e.g. v0.1.0)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Run tests
        run: uv run python -m pytest -q

      - name: Build app bundle
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build_macos_app.sh --no-install

      - name: Zip app
        id: zip
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          ZIP="Alt-Agent-Harness-${VERSION}-macOS-$(uname -m).zip"
          ditto -c -k --keepParent "dist/Alt Agent Harness.app" "dist/${ZIP}"
          echo "zip=dist/${ZIP}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: ${{ steps.zip.outputs.zip }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          gh release upload "$TAG" "${{ steps.zip.outputs.zip }}" --clobber
